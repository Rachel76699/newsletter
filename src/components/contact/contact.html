<div class="contact-card">
  <h2>{{ contact.name }}</h2>
  <p>Email: {{ contact.email }}</p>
  <button (click)="isEditing=true">Edit</button>
  <button (click)="deleteContact()">Delete</button>

  @if(isEditing) {  
    <form [formGroup]="contactForm">
      <input type="text" name="name" formControlName="name" placeholder="Name">
      <input type="email" name="email" formControlName="email" placeholder="Email">
      <button type="submit" [disabled]="contactForm.invalid" (click)="editContact()">Save</button>
    </form>
  }
</div>
